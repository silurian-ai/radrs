[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "radrs"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.20",
    "pyarrow>=23.0.0",
    "xarray>=2024.1",
]

[project.optional-dependencies]
zarr = ["zarr>=3"]
test = ["pytest", "pytest-asyncio", "pytest-benchmark", "xradar"]
ray = ["ray"]

[tool.maturin]
python-source = "python"
module-name = "radrs._radrs"
features = ["pyo3/extension-module"]
# We don't need to auditwheel, because we don't need manylinux
auditwheel = "skip"
# Build artifacts with the specified Cargo profile
profile = "release"
# For "editable" builds, use the specified Cargo profile,
# e.g. to use "dev" builds for local development
# (uses `profile` if this key is not set)
editable-profile = "dev"
# Require Cargo.lock and cache are up to date
# Decreases reloads
frozen = false
# Require Cargo.lock is up to date
# Decreases reloads
locked = false
# Strip the library for minimum file size
# TODO: test more thoroughly with fully optimized and minimal build
# strip = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access (deselect with '-m \"not network\"')",
    "benchmark: performance benchmarks (deselect with '-m \"not benchmark\"')",
]

[tool.uv]
# Automatically rebuilds on uv sync
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[dependency-groups]
dev = [
    "arm-pyart>=2.2.0",
    "fsspec>=2026.1.0",
    "marimo>=0.19.4",
    "maturin[patchelf]>=1.11.5",
    "maturin-import-hook>=0.3.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=4.0.0",
    "ray>=2.53.0",
    "s3fs>=2026.1.0",
    "xradar>=0.11.0",
]
