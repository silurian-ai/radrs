[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "radrs"
description = "Fast NEXRAD Level 2 data parsing into xarray"
readme = "README.md"
authors = [{ name = "Silurian AI", email = "contact@silurian.ai" }]
keywords = ["nexrad", "weather", "radar", "meteorology", "xarray", "zarr"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
license = { file = "LICENSE" }
dynamic = ["version"]
dependencies = [
    "numpy>=1.20",
    "pyarrow>=22.0.0",
    "xarray>=2024.10.0",
]

[project.urls]
Documentation = "https://silurian-ai.github.io/radrs"
Repository = "https://github.com/silurian-ai/radrs"
Issues = "https://github.com/silurian-ai/radrs/issues"

[project.optional-dependencies]
zarr = ["zarr>=3"]
test = ["pytest", "pytest-asyncio", "pytest-benchmark", "xradar"]
ray = ["ray"]

[tool.maturin]
python-source = "python"
module-name = "radrs._radrs"
features = ["pyo3/extension-module"]
# Skip auditwheel since we don't need manylinux compliance
auditwheel = "skip"
# Use release profile for installed builds
profile = "release"
# Use dev profile for editable/local builds (faster compilation)
editable-profile = "dev"


[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access (deselect with '-m \"not network\"')",
    "benchmark: performance benchmarks (deselect with '-m \"not benchmark\"')",
]

[tool.uv]
# Automatically rebuilds on uv sync
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[dependency-groups]
dev = [
    "arm-pyart>=2.2.0",
    "anywidget>=0.9.18",
    "fsspec>=2026.1.0",
    "marimo>=0.19.4",
    "maturin[patchelf]>=1.11.5",
    "maturin-import-hook>=0.3.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=4.0.0",
    "ray>=2.53.0",
    "s3fs>=2026.1.0",
    "traitlets>=5.14.3",
    "xradar>=0.11.0",
    "zizmor>=1.24.1",
]
docs = [
    "zensical",
    "mkdocstrings[python]",
    "mike @ git+https://github.com/squidfunk/mike.git",
]
