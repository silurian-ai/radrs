name: Docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'python/radrs/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'python/radrs/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docs.yml'

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # mike needs full history of gh-pages to update versioned docs.
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      # Caches are scoped to PR validation only — not deploy paths.
      # The deploy paths (push to main, release tags) push to gh-pages,
      # so a poisoned cache restored on a deploy run could ship malicious
      # content to the published site (zizmor cache-poisoning audit).
      - name: Cache Rust dependencies
        if: github.event_name == 'pull_request'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: ${{ github.event_name == 'pull_request' }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Configure git identity
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build docs (PR validation)
        if: github.event_name == 'pull_request'
        run: uv run zensical build

      - name: Deploy dev alias (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run mike deploy --push --update-aliases dev

      - name: Deploy versioned docs (release tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' and keep only MAJOR.MINOR (e.g. v0.3.5 -> 0.3).
          tag="${GITHUB_REF_NAME#v}"
          version="${tag%.*}"
          echo "Deploying docs for version ${version} (from tag ${GITHUB_REF_NAME})"
          uv run mike deploy --push --update-aliases "${version}" latest
          uv run mike set-default --push latest
