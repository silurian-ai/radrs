name: Docs (deploy)

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      # docs/changelog.md includes the root CHANGELOG.md via pymdownx.snippets;
      # release-please touches CHANGELOG.md on every release, so the deploy
      # has to re-publish when only that file changed.
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'python/radrs/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docs-deploy.yml'

  # Versioned docs publish off the GitHub Release, not the tag push. A `push`
  # trigger shares one `paths` filter across its branches and tags, and a tag
  # push has no changed-file diff, so the tag half never matched and versioned
  # docs were never deployed.
  release:
    types: [published]

  # Manual backfill / re-publish. `tag` is the git ref the docs are built from;
  # `version` overrides the published docs version when it should differ from
  # the one derived from the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build docs from, e.g. radrs-v0.3.7'
        required: true
      version:
        description: 'Docs version to publish as (default: minor series of the tag, e.g. 0.3)'
        required: false

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

concurrency:
  # Every deploy path pushes to gh-pages, and a release lands at the same time
  # as its release commit on main. One group so they queue instead of racing.
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          # mike needs full history of gh-pages to update versioned docs.
          fetch-depth: 0
          persist-credentials: true

      # Deploy paths run uncached: this workflow has contents: write and
      # pushes to gh-pages, so caches sourced from another run could
      # poison the published site (zizmor cache-poisoning audit).
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          toolchain: stable
          cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install docs dependencies
        run: uv sync --locked --no-default-groups --group docs

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy dev alias (push to main)
        if: github.event_name == 'push'
        run: uv run --locked --no-default-groups --group docs mike deploy --push --update-aliases dev

      - name: Deploy versioned docs (release)
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'release' && !github.event.release.prerelease)
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DOCS_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${DOCS_VERSION}" ]; then
            version="${DOCS_VERSION}"
          else
            case "${RELEASE_TAG}" in
              radrs-v*) tag="${RELEASE_TAG#radrs-v}" ;;
              v*) tag="${RELEASE_TAG#v}" ;;
              *)
                echo "Unsupported release tag: ${RELEASE_TAG}" >&2
                exit 1
                ;;
            esac
            # Docs are versioned per minor series, so 0.3.7 publishes as 0.3.
            version="${tag%.*}"
          fi
          echo "Deploying docs for version ${version} (from tag ${RELEASE_TAG})"
          uv run --locked --no-default-groups --group docs mike deploy --push --update-aliases "${version}" latest
          uv run --locked --no-default-groups --group docs mike set-default --push latest
