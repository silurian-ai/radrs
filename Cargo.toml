[package]
name = "radrs"
version = "0.3.3"
edition = "2024"

[lib]
name = "radrs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Python bindings
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"

# NEXRAD parsing
nexrad-data = { version = "=1.0.0-rc.7", default-features = false, features = ["nexrad-model", "parallel"] }
nexrad-decode = "=1.0.0-rc.3"
nexrad-model = "=1.0.0-rc.2"

# Cloud storage access (S3, GCS, Azure, local)
object_store = { version = "0.13", features = ["aws", "gcp", "azure"] }
bytes = "1"

# Async
tokio = { version = "1", features = ["full"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Parallelism
rayon = "1.10"

# Date/time handling
chrono = "0.4"

# Logging - opt-in via radrs.initialize_logs() or RADRS_LOG env var
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Globals
once_cell = "1.19"

# Memory allocator (better multi-threaded performance on Linux)
mimalloc = { version = "0.1", default-features = false, optional = true }

# URL parsing
url = "2"

# Regular expressions
regex = "1"

# Futures
futures = "0.3"

# Gzip decompression
flate2 = "1.1"

# Zero-copy parsing (needed for nexrad header parsing)
zerocopy = "0.8"

[features]
default = []
fast-alloc = ["mimalloc"]

# Optimize release builds for better runtime performance
[profile.release]
lto = 'fat'
codegen-units = 1
