[package]
name = "radrs"
version = "0.1.0"
edition = "2024"

[lib]
name = "radrs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Python bindings
pyo3 = { version = "0.27", features = ["extension-module"] }
numpy = "0.27"

# NEXRAD parsing (from fork with dual-pole fixes)
nexrad-data = { git = "https://github.com/rejuvyesh/nexrad", branch = "jkg/dual-pole-parsing", default-features = false, features = ["nexrad-model", "parallel-decode", "parallel-decompress"] }
nexrad-decode = { git = "https://github.com/rejuvyesh/nexrad", branch = "jkg/dual-pole-parsing" }
nexrad-model = { git = "https://github.com/rejuvyesh/nexrad", branch = "jkg/dual-pole-parsing" }

# S3 access
object_store = { version = "0.11", features = ["aws"] }

# Async
tokio = { version = "1", features = ["full"] }
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Parallelism
rayon = "1.10"

# Date/time handling
chrono = "0.4"

# Logging - opt-in via radrs.initialize_logs() or RADRS_LOG env var
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Globals
once_cell = "1.19"

# URL parsing
url = "2"

# Futures
futures = "0.3"

# Gzip decompression
flate2 = "1.1"

# Zero-copy parsing (needed for nexrad header parsing)
zerocopy = "0.8"

[features]
default = []
