[package]
name = "radrs"
version = "0.4.0"
edition = "2024"

[lib]
name = "radrs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Python bindings
# NOTE: do not add `features = ["extension-module"]` here. That feature tells
# pyo3 not to link libpython, which is required for the wheel but breaks every
# target that links a binary -- including `cargo test`. maturin supplies it via
# `features = ["pyo3/extension-module"]` in pyproject.toml's [tool.maturin].
#
# Caveat: a `--features` passed on maturin's command line REPLACES that
# pyproject list rather than adding to it, so any wheel build that passes
# --features must repeat `pyo3/extension-module` itself. The Linux and
# musllinux jobs in .github/workflows/release.yml do exactly that.
pyo3 = { version = "0.30.1" }
numpy = "0.30"

# NEXRAD parsing
# Git dependencies on our nexrad fork while the `recast-bzip2` feature (vendored
# pure-Rust bzip2 decoder for LDM records, ~2x faster single-threaded than
# libbz2-rs-sys) is upstreamed; see https://github.com/danielway/nexrad/pull/218.
# All three crates must come from the same rev because nexrad-data depends on
# the others by path.
nexrad-data = { git = "https://github.com/silurian-ai/nexrad", rev = "25bf6983843e6aae8cc790a95e763d48a7f65acf", default-features = false, features = ["model", "parallel", "recast-bzip2"] }
nexrad-decode = { git = "https://github.com/silurian-ai/nexrad", rev = "25bf6983843e6aae8cc790a95e763d48a7f65acf" }
nexrad-model = { git = "https://github.com/silurian-ai/nexrad", rev = "25bf6983843e6aae8cc790a95e763d48a7f65acf" }

# Cloud storage access (S3, GCS, Azure, local)
object_store = { version = "0.14.2", features = ["aws", "gcp", "azure"] }
bytes = "1"

# Async
tokio = { version = "1", features = ["full"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }

# Error handling
thiserror = "2.0"

# Parallelism
rayon = "1.10"

# Date/time handling
chrono = "0.4"

# Logging - opt-in via radrs.initialize_logs() or RADRS_LOG env var
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Globals
once_cell = "1.19"

# Memory allocator (better multi-threaded performance on Linux)
mimalloc = { version = "0.1", default-features = false, optional = true }

# URL parsing
url = "2"

# Regular expressions
regex = "1"

# Futures
futures = "0.3"

# Gzip decompression
flate2 = "1.1"

[features]
default = []
fast-alloc = ["mimalloc"]

# Optimize release builds for better runtime performance
[profile.release]
lto = 'fat'
codegen-units = 1

# Keep CI representative of optimized production code without paying the full
# release-link cost on every pull request.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
