site_name: radrs
site_description: Fast NEXRAD Level 2 processing for Python.
site_url: https://silurian-ai.github.io/radrs/
repo_url: https://github.com/silurian-ai/radrs
repo_name: silurian-ai/radrs
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 <a href="https://silurian.ai">Silurian AI Inc.</a>

theme:
  name: material
  logo: assets/radrs-glyph.png
  favicon: assets/radrs-glyph.png
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/silurian.css

extra:
  version:
    provider: mike
    default: latest

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            show_signature_annotations: false
            separate_signature: false
            signature_crossrefs: true
            members_order: source
            inherited_members: false
            heading_level: 2
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Install: install.md
  - Guides:
      - Quickstart: guides/quickstart.md
      - S3 archive iteration: guides/s3-archive.md
      - Batch iteration and folding: guides/batching.md
      - Raystack format: guides/raystack-format.md
      - Quality control: guides/qc.md
      - xradar interop: guides/xradar-interop.md
      - Visualization: guides/visualization.md
  - API reference:
      - radrs: reference/radrs.md
      - radrs.xradar: reference/xradar.md
      - radrs.raystack: reference/raystack.md
      - radrs.qc: reference/qc.md
      - radrs.ops: reference/ops.md
      - radrs.viz: reference/viz.md
  - Changelog: changelog.md
